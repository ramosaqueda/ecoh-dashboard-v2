# docker-compose.test.yml - ENTORNO DE PRUEBAS CORREGIDO
services:
  app-test:
    build: .
    container_name: ecoh-app-test
    restart: unless-stopped
    ports:
      - "3001:3000"  # Puerto de pruebas diferente
    
    # ✅ VARIABLES DE ENTORNO COMPLETAS
    environment:
      # Variables de aplicación
      - NODE_ENV=production
      
      # Base de datos (PostgreSQL local)
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@host.docker.internal:${DB_PORT}/${DB_NAME}?schema=public
      
      # URLs de la aplicación
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      
      # 🔑 Variables de Clerk (AGREGADAS)
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NEXT_PUBLIC_CLERK_SIGN_IN_URL=${NEXT_PUBLIC_CLERK_SIGN_IN_URL}
      - NEXT_PUBLIC_CLERK_SIGN_UP_URL=${NEXT_PUBLIC_CLERK_SIGN_UP_URL}
      - NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=${NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL}
      - NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL=${NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL}
    
    # Opción alternativa: cargar desde archivo .env.test
    # env_file:
    #   - .env.test
    
    volumes:
      - test_data:/app/data
      - ./uploads:/app/public/uploads
      - ./test-logs:/app/logs
    
    networks:
      - app_network_test
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  app_network_test:
    driver: bridge

volumes:
  test_data:
    driver: local
    name: actividades_test_data